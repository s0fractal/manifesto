name: papers-deposit-check

# The closed-manifest deposit gate for papers/ (Codex closure P0-4). Green here
# means TWO separate things are true, and the job keeps them separate:
#   1. the gate MECHANISM checks and fails-closed correctly (test_deposit_check.py,
#      including all six required mutations) — evaluator-independent;
#   2. each paper's claim-manifest still BINDS its candidate draft by digest and its
#      closed ledger set (engine == OK). Editing a draft without re-pinning its
#      manifest turns this red — that is the freshness discipline, not a flake.
#
# Green does NOT mean deposit-clean: both papers are expected to be DEPOSIT: BLOCKED
# (Paper A refuses the not-yet-deposited frozen corpus; Paper B refuses the
# un-vendored DRAFT profile, and refuses B7 as WARRANT_ARTIFACT_NOT_BINDABLE — its
# two Warrant observations are exact and are run below, but an external released
# artifact cannot be bound here, so they are reported and not credited). That is the
# honest shape of absence the gate exists to record; the corpus/profile later flip
# specific claims from REFUSED to CHECKED. B7 does not flip.
on: [push, pull_request]

jobs:
  deposit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        # Full history: the C2-MAP activation strategy verifies the two governance commits
        # (activation + receipt) and the pre-activation parent from the Git object database.
        # A shallow checkout would leave the activated deposit unable to see that history
        # (ACTIVATION_COMMIT_MISSING). Must land BEFORE the operator act.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      - name: Install the version-pinned released evaluator (no source checkout)
        run: pip install "sigma-glyph==0.6.7"

      - name: Deposit-gate mechanism + mutations green (evaluator-independent)
        shell: bash
        run: |
          set -euo pipefail
          python3 papers/test_deposit_check.py | tee mech.log
          grep -q "GREEN: the deposit-check mechanism checks and fails-closed correctly." mech.log

      - name: B7 observations — REAL, printed, and explicitly NOT credit
        # This step runs B7's two observations against the released `warrant-verify==0.9.0`
        # so the exact operands stay visible and stay honest. It awards NOTHING: the gate
        # is asserted to still refuse B7 with the artifact installed and named. If a future
        # change lets a present interpreter flip B7 to CHECKED, this step goes red.
        # Nothing about this environment is committed (no venv, wheel, report or cache).
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/warrant-0.9.0"
          "$RUNNER_TEMP/warrant-0.9.0/bin/pip" install --quiet "warrant-verify==0.9.0"
          # observation 1 — one stored check re-executes, exactly
          ( cd drafts/ssd-pack && "$RUNNER_TEMP/warrant-0.9.0/bin/python" -I -m warrant \
              --store .warrants check \
              0597575d21d62c2db265c0d17e3a2c8c1b2db880342b117a403af7e9c4c03c87 ) | tee check.log
          grep -qx "pass  result=e0419cc5112a95f9e35a019539b25f00eccbea33122a5736a20897d8eea5bf00  atp_spent=2108" check.log
          # observation 2 — the pack as a whole is still legacy-sealed (exit 1 is EXPECTED)
          rc=0; python3 tools/replay_pack.py replay drafts/ssd-pack > replay.log 2>&1 || rc=$?
          cat replay.log
          test "$rc" -eq 1
          grep -qx "REPLAY: LEGACY_UNPINNED" replay.log
          # ...and neither observation moves the report. B7 stays REFUSED, artifact present.
          MANIFESTO_WARRANT_PYTHON="$RUNNER_TEMP/warrant-0.9.0/bin/python" \
            python3 papers/test_deposit_check.py | tee b7.log
          grep -q "ok   REAL warrant-verify==0.9.0 present and B7 STILL REFUSED (non-crediting)" b7.log
          grep -q "GREEN: the deposit-check mechanism checks and fails-closed correctly." b7.log
          MANIFESTO_WARRANT_PYTHON="$RUNNER_TEMP/warrant-0.9.0/bin/python" \
            python3 papers/deposit_check.py \
            papers/addressing-is-equality/claim-manifest.json > gate.log || true
          cat gate.log
          grep -q "XX  B7: REFUSED \[WARRANT_ARTIFACT_NOT_BINDABLE\]" gate.log

      - name: Corpus exporter mechanism (F1-F9) green (no quarantine, no evaluator)
        shell: bash
        run: |
          set -euo pipefail
          python3 papers/corpus/test_corpus.py | tee corpus.log
          grep -q "^GREEN: extraction is mechanical" corpus.log

      - name: Each paper binds its candidate + closed ledger set; report is honest
        shell: bash
        env:
          SIGMA_GLYPH: /nonexistent-on-purpose
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, json
          sys.path.insert(0, "papers")
          from deposit_check import evaluate
          reports = {}
          for p in ("every-check-spawns-more", "addressing-is-equality"):
              r = evaluate(f"papers/{p}/claim-manifest.json")
              reports[p] = r
              assert r["engine"] == "OK", f"{p}: engine FAIL_CLOSED: {r['engine_faults']}"
              assert r["deposit"] == "BLOCKED", f"{p}: expected BLOCKED at this stage"
              print(f"{p}: engine OK; CHECKED={r['summary']['checked']} "
                    f"EXCLUDED={r['summary']['excluded']} REFUSED={r['summary']['refused']}")
          a, b = reports["every-check-spawns-more"], reports["addressing-is-equality"]
          # Lock the contract: live-evaluator claims must actually re-derive,
          # and absence must be REFUSED (not string-matched).
          assert "C5" in a["summary"]["checked"], "Paper A C5 (COMPILE-0030) must re-derive"
          assert "B1" in b["summary"]["checked"], "Paper B B1 (glyphlib costs) must re-derive"
          assert "FROZEN_CORPUS_NOT_DEPOSITED" in {c["reason"] for c in a["claims"]}
          print("contract locked: live claims re-derive; absence is refused, not string-matched")
          PY
