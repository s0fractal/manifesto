name: embedded-claims-poc

# A green board must mean a check ran. This gate preserves the capsule-only
# parse → compile → run route, its non-empty real-document specimen, and the
# explicitly legacy phase-1 falsifiers against a version-pinned evaluator.
on: [push, pull_request]

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      # The PoC's verifier identities are a code CLOSURE that includes the
      # evaluator's bytes. The fixtures pin those identities against the released
      # sigma-glyph==0.6.7 evaluator; a clean install of that version must
      # reproduce them. Installing a DIFFERENT Sigma changes the evaluator bytes
      # and the closure digest, so the glyph/settle-gate fixtures would go
      # UNVERIFIED — that is the closure discipline working, not a flake. Bumping
      # Sigma is therefore a deliberate act that requires recomputing the pins.
      #
      # SIGMA_GLYPH is pointed at nothing so the historical sibling-checkout
      # branch cannot be taken (tools/sigma_boundary.py ignores it and says so).
      - name: Install the version-pinned released evaluator (no source checkout)
        run: pip install "sigma-glyph==0.6.7"

      # Controlled-forgetting is useful only if an active consumer falls when a
      # retired draft or zombie reference returns. The selftest proves the check
      # can fail; the live invocation binds the current tree.
      - name: Embedded-claims active-surface retirement boundary
        run: |
          python3 tools/embedded_claims_surface_check.py --selftest
          python3 tools/embedded_claims_surface_check.py

      # The explicitly legacy inline harness remains as negative evidence. Its
      # 22 fixtures + 5 invariants reproduce from a clean installation. This is
      # not an alternative authoring route: canonical authoring is capsule-only.
      # Effects are OBSERVED post-state, not sandbox-enforced, and the verifier
      # identity binds code bytes but not the interpreter build or OS.
      - name: Legacy falsifiers reproduce against released 0.6.7
        shell: bash
        env:
          SIGMA_GLYPH: /nonexistent-on-purpose
        run: |
          set -euo pipefail
          python3 -c "import sigma_glyph; print('evaluator:', sigma_glyph.__file__)"
          python3 drafts/embedded-claims-poc/test_poc.py | tee poc.log
          grep -q "ALL PASS (22 fixtures + 5 invariants)" poc.log

      # The current PARSE layer uses a PINNED markdown-it-py + mdurl, both
      # with wheel hashes, installed via --require-hashes (a bare version pin would
      # leave mdurl transitively unpinned — Codex). The parser identity closure
      # references this lock, so a drifting dependency fails loudly.
      - name: Install the pinned parser dependencies (hash-locked)
        run: pip install --require-hashes -r drafts/embedded-claims-poc/requirements-parser.lock

      - name: Parser PARSE-layer oracle reproduces over the adversarial corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import markdown_it; assert markdown_it.__version__=='4.2.0'; print('markdown-it-py', markdown_it.__version__)"
          python3 drafts/embedded-claims-poc/test_parser.py | tee parse.log
          grep -q "ALL PASS (13 PARSE specimens + 4 invariants)" parse.log

      # The COMPILE layer is STRUCTURAL only — VALID ParseReport →
      # strict JSON → capsule.v2 → canonical records/IDs. It settles nothing (that is
      # RUN); COMPILED does not mean REPLAYED. A parser report with status != VALID is
      # REFUSED as a whole.
      - name: Compiler COMPILE-layer oracle (structural, no settlement)
        shell: bash
        run: |
          set -euo pipefail
          python3 drafts/embedded-claims-poc/test_compiler.py | tee compile.log
          grep -q "ALL PASS (14 COMPILE specimens + 9 invariants)" compile.log

      # The RUN layer crosses the epistemic membrane: a COMPILED
      # bundle → EXECUTE → vector REPORT. It reads no Markdown, re-verifies every id/link
      # before any evaluator call (a mutation ⇒ 0 evaluator invocations), gives one
      # result per record with NO document-level MATCH, and never raises binding above
      # ASSERTED. Needs both the pinned parser deps and the pinned evaluator.
      - name: Runner boundary (COMPILED bundle → vector REPORT)
        shell: bash
        run: |
          set -euo pipefail
          python3 drafts/embedded-claims-poc/test_runner.py | tee run.log
          grep -qE "^ALL PASS \([0-9]+ runner-boundary checks\)" run.log

      # Orchestration CLI + end-to-end on a REAL document. test_cli invokes the public
      # `claims run` command as a subprocess: --strict must NOT be vacuously green on an
      # empty vector (a RUN with zero records fails under --strict, so an extraction
      # regression can't leave this green), and the specimen must run a NON-EMPTY EXACT
      # scope — one record, README-THESIS-HEADING-COUNT, REPLAYED — against a pinned README
      # snapshot. A README or engine change rotates the pin and this fails until re-pinned
      # (closure/freshness discipline on the real specimen too).
      - name: Orchestration CLI + E2E exact scope (public command, real document)
        shell: bash
        run: |
          set -euo pipefail
          python3 drafts/embedded-claims-poc/test_cli.py | tee cli.log
          grep -q "ALL PASS (CLI checks)" cli.log
