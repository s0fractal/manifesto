name: Warrant store verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  warrant-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Warrant 3 engine
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir "git+https://github.com/s0fractal/warrant.git@ab09db55f09e1f21a77bef2ee7de7ed9f52bb6c4"
      - name: Verify .warrant/ store signatures, schemas, and lineages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from warrant import repo as RP
          rep = RP.Repo(".")
          r = rep.report()
          print(f"snapshot={r['snapshot']} schemas={len(r['schemas'])} lineages={len(r['lineages'])} rejected={len(r['rejected'])} problems={len(r['problems'])}")
          assert not r["rejected"], f"rejected records: {r['rejected']}"
          assert not r["problems"], f"store problems: {r['problems']}"
          PY
